name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke import
        run: |
          python -c "from writer_app.cli import main; print('imports ok')"

      - name: writer --help
        run: writer --help

      - name: writer providers (no Ollama on CI → exit 1 with the start hint)
        shell: bash
        run: |
          set +e
          writer providers > providers.out 2>&1
          rc=$?
          cat providers.out
          test "$rc" -eq 1 && grep -q "brew services start ollama" providers.out

      - name: Pytest with coverage
        run: |
          pytest tests \
            --cov=writer_app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m coverage report --format=total
          echo "TOTAL_COVERAGE=$(python -m coverage report --format=total)" >> "$GITHUB_ENV"

      - name: Upload coverage XML (Ubuntu / 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Upload coverage HTML (Ubuntu / 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

  build-installer:
    name: Build self-extracting installer
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: |
          bash scripts/build-installer.sh dist/writer-app-install.sh
          ls -lh dist/
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: writer-app-install.sh
          path: dist/writer-app-install.sh
          retention-days: 7
