name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Smoke import
        run: |
          python -c "from writer_app.cli import main; print('imports ok')"

      - name: writer --help
        run: writer --help

      - name: writer providers
        run: writer providers

      - name: Pytest
        run: pytest tests -q

  build-installer:
    name: Build self-extracting installer
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: |
          bash scripts/build-installer.sh dist/writer-app-install.sh
          ls -lh dist/
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: writer-app-install.sh
          path: dist/writer-app-install.sh
          retention-days: 7
