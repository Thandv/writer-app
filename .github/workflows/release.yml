name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build installer and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Determine version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building for version $VERSION"

      - name: Build wheel + sdist
        run: |
          python -m build
          ls -lh dist/

      - name: Build self-extracting installer
        run: |
          bash scripts/build-installer.sh "dist/writer-app-install.sh" "${{ steps.ver.outputs.version }}"
          ls -lh dist/

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          # Pull the section for the current version out of CHANGELOG.md
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
              /^## \[/ {
                  if (found) exit
                  if ($0 ~ "\\[" v "\\]") { found=1; next }
              }
              found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
              echo "Release $VERSION" > release-notes.md
          fi
          echo "Generated release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "writer-app ${{ github.ref_name }}"
          body_path: release-notes.md
          files: |
            dist/writer-app-install.sh
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
